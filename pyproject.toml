[project]
name = "taraweb-seo-auditor"
version = "0.1.0"
description = "Local-first, open-source technical SEO crawler and website audit tool by TaraWeb."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TaraWeb" }]
keywords = ["seo", "seo-audit", "web-crawler", "technical-seo", "flask"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "flask>=3.0,<4",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "lxml>=6.1,<7",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
javascript = ["playwright>=1.40,<2"]
dev = ["pytest>=8.4,<10", "pip-audit>=2.9,<3", "bandit>=1.8,<2"]

[project.urls]
Homepage = "https://taraweb.tech/"
Source = "https://github.com/taraweb-global/taraweb-seo-auditor"
Issues = "https://github.com/taraweb-global/taraweb-seo-auditor/issues"
"Original source" = "https://github.com/puneetindersingh/open-seo-crawler"
