name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app.py challenge_browser.py
      - name: Test
        run: pytest -q
      - name: Static security analysis
        run: bandit -q -r -ll app.py challenge_browser.py
      - name: Audit dependencies (PyPI advisory service)
        run: python -m pip_audit -r requirements.txt
      - name: Audit dependencies (OSV)
        run: python -m pip_audit -r requirements.txt --vulnerability-service osv
